<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="description" content="Brand new coffeshop" />
    <meta name="author" content="Eduard Petrosian" />
    <meta name="keywords" content="HTML, CSS" />
    <title>Spots</title>
    <link rel="icon" href="favicon.ico" />
    <script defer="defer" src="main.js"></script>
    <link href="main.css" rel="stylesheet" />
  </head>
  <body>
    <div class="page">
      <header class="header">
        <img
          src="8650253b58b46f0f1c06.svg"
          alt="Spot Logo"
          class="header__logo"
        />
      </header>
      <main class="content">
        <section class="profile">
          <div class="profile__avatar-container">
            <button class="profile__avatar-btn">
              <img
                src="<%=require('./images/Edit_avatar.svg')%>"
                alt=""
                class="profile__pencil-icon"
              />
            </button>
            <img
              src="4a48bfc92ea7b08b7842.jpg"
              alt="Avatar"
              class="profile__avatar"
            />
          </div>
          <div class="profile__column">
            <h1 class="profile__name">Bessie Coleman</h1>
            <p class="profile__description">Civil Aviator</p>
            <button class="profile__edit-btn" type="button">
              <img src="5c2584faa41177b41691.svg" alt="Edit" /> Edit Profile
            </button>
          </div>
          <button class="profile__add-btn" type="button">
            <img src="40608da7369d39bc1077.svg" alt="Plus icon" /> New Post
          </button>
        </section>
        <section class="cards">
          <ul class="cards__list">
            <template id="card-template"
              ><li class="card">
                <button class="card__delete-button" type="button"></button>
                <img
                  src="./images/1-photo-by-moritz-feldmann-from-pexels-min.jpg"
                  alt="Val Thorens"
                  class="card__image"
                />
                <div class="card__content">
                  <h2 class="card__title">Val Thorens</h2>
                  <button class="card__like-btn" type="button"></button>
                </div></li
            ></template>
          </ul>
        </section>
      </main>
      <footer class="footer">
        <p class="footer__copyright">2025 © Spots</p>
      </footer>
      <div class="modal" id="edit-profile-modal">
        <div class="modal__container">
          <button class="modal__close-btn" type="button"></button>
          <h2 class="modal__title">Edit Profile</h2>
          <form name="edit-profile" class="modal__form" novalidate>
            <label for="profile-name-input" class="modal__label"
              >Name
              <input
                id="profile-name-input"
                placeholder="Type your name"
                class="modal__input"
                minlength="2"
                maxlength="40"
                required /><span
                id="profile-name-input-error"
                class="modal__error"
              ></span></label
            ><label for="profile-description-input" class="modal__label"
              >Description
              <input
                id="profile-description-input"
                class="modal__input"
                placeholder="Describe yourself"
                minlength="2"
                maxlength="200"
                required /><span
                class="modal__error"
                id="profile-description-input-error"
              ></span
            ></label>
            <button type="submit" class="modal__submit-btn">Save</button>
          </form>
        </div>
      </div>
      <div class="modal" id="add-card-modal">
        <div class="modal__container">
          <button class="modal__close-btn" type="button"></button>
          <h2 class="modal__title">New Post</h2>
          <form name="add-card-form" class="modal__form" novalidate>
            <label for="card-image-input" class="modal__label"
              >Image link
              <input
                type="url"
                id="card-image-input"
                placeholder="Place a link to the picture"
                class="modal__input"
                required /><span
                class="modal__error"
                id="card-image-input-error"
              ></span></label
            ><label for="caption-input" class="modal__label"
              >Caption
              <input
                id="caption-input"
                class="modal__input"
                placeholder="Caption yourself"
                minlength="2"
                maxlength="30"
                required /><span
                class="modal__error"
                id="caption-input-error"
              ></span
            ></label>
            <button type="submit" class="modal__submit-btn">Save</button>
          </form>
        </div>
      </div>
      <div class="modal modal_type_preview" id="preview-modal">
        <div class="modal__image-container">
          <button
            class="modal__close-btn modal__close-preview"
            type="button"
          ></button>
          <img src="#" alt="Preview Image" class="modal__image" />
          <p class="modal__caption"></p>
        </div>
      </div>
      <div class="modal" id="avatar-modal">
        <div class="modal__container">
          <button class="modal__close-btn" type="button"></button>
          <h2 class="modal__title">Edit Avatar</h2>
          <form id="edit-avatar-form" class="modal__form">
            <label for="profile-avatar-input" class="modal__label"
              >Avatar
              <input
                id="profile-avatar-input"
                placeholder="Avatar goes here"
                class="modal__input"
                name="avatar"
                required /><span
                id="profile-avatar-input-error"
                class="modal__error"
              ></span></label
            ><button type="submit" class="modal__submit-btn">Save</button>
          </form>
        </div>
      </div>
    </div>
  </body>
</html>
